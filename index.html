<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Comunidad digital </title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main>
    <section class="contenedor">
      <h1>Formulario de participación ciudadana</h1>

      <p>
        Este formulario es un espacio para que tu voz sea escuchada.
        Participa compartiendo tus ideas para mejorar nuestra comunidad digital.
      </p>

      <form>
        <div class="campo">
          <label for="categoria">¿Con qué tiene que ver tu propuesta?</label>
          <select id="categoria" name="categoria">
            <option value="" disabled selected>Selecciona una opción...</option>
            <option value="recreacion">Recreación</option>
            <option value="deporte">Deporte</option>
            <option value="ayuda">Ayuda comunitaria</option>
            <option value="educacion">Educación</option>
            <option value="medio-ambiente">Medio ambiente</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        
        
        <div class="campo" id="campo-otro">
          <label for="cual_otro">Si elegiste "Otro", especifica cuál:</label>
          <input 
            type="text" 
            id="cual_otro" 
            name="cual_otro" 
            placeholder="Ej: Cultura, Salud, Tecnología...">
        </div>
</div>
        <div class="campo">
          <label for="nombre" >Nombre Completo< </label>
          <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            placeholder="Ej: Pedro Sanchez">
        </div>

        <div class="campo">
          <label for="propuesta">Propuesta o mensaje</label>
          <textarea 
            id="propuesta" 
            name="propuesta" 
            placeholder="Cuentanos tu idea o propuesta para mejorar nuestra comunidad"></textarea>
        </div>

        <div class="campo">
          <label for="contacto">Correo o teléfono de contacto opcional</label>
          <input 
            type="text" 
            id="contacto" 
            name="contacto" 
            placeholder="Escribe aqui tu correo o número de celular">
        </div>

        <div class="campo">
          <label>
            <input type="checkbox" name="consentimiento">
            Acepto que mi información sea usada únicamente para fines de participación comunitaria.
          </label>
        </div>

        <button type="submit">Enviar participación</button>
      </form>
    </section>
  </main>

</body>
</html>
